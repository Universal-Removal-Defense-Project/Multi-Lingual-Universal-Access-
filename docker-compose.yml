services:
  db:
    image: postgres:18
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Deletes expired session rows, which hold unsubmitted intake answers. Django never does
  # this by itself. Overriding the entrypoint skips migrate/compilemessages, so this never
  # races the web service at start-up.
  session-cleanup:
    build: .
    env_file: .env
    volumes:
      - .:/app
    entrypoint: ["sh", "-c", "while true; do python manage.py clearsessions; sleep 900; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: